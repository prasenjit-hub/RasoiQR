name: CI

# Everything that must be true before a commit reaches production.
#
# There is no CI/CD in front of Vercel: a push to `main` IS the deploy. That is
# why this exists. The two bugs found on 2026-10-30 both compiled, both built,
# and both would have shipped:
#
#   · `challenges.cloudflare.com` dropped from the CSP in vercel.json — the page
#     builds fine, but the Turnstile widget is blocked in the browser and every
#     order fails.
#   · an anon/service-role contradiction in the order gate — compiles, builds,
#     and only shows up when a guest taps Place Order.
#
# Neither is a type error, so `tsc` alone cannot see them. The submit-order
# suite can: it runs the REAL function source (not a copy) against Cloudflare's
# documented test secrets, and asserts every branch — 503 on a missing secret,
# 403 on a refused token, fail-open on a Cloudflare outage, and that only an
# allow-list reaches the RPC.
#
# ⚠️ This is a deploy gate, in two ordered phases (docs/runbooks/order-flow.md).
# The last step fires a Vercel **Deploy Hook**, so it only ever runs once every
# check above is green. As soon as `git.deploymentEnabled` is `false` in
# vercel.json, Vercel stops deploying on push entirely and that hook is the only
# path to production — a red commit then simply never ships, and the previous
# deployment stays live. Until the flag is flipped this step is a warning: the
# Git integration still deploys every push, so nothing is blocked yet. The order
# matters — flip the flag before the hook secret exists and deployments stop
# dead, silently.
#
# ⚠️ Deliberately NOT Vercel's "Ignored Build Step" (`ignoreCommand`). It runs
# BEFORE the build, seconds after the push, while CI is still going — it has no
# verdict to read. Worse, Vercel evaluates it for Deploy Hook builds too, so a
# command that skips "git pushes" also skips the hook's own build. That is how a
# site stops updating and nobody notices for a week.
#
# Notifications are GitHub's own: a failed run emails whoever pushed (Settings →
# Notifications → Actions). No extra setup and no SMTP secret is involved.
#
# Deliberately NOT run here: `npm run lint`. The repo carries known warnings
# (`any` types, set-state-in-effect) that are unaddressed on purpose; a lint
# step would be red from the very first run and teach everyone to ignore this
# workflow — which is worse than not having the step.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Pushing twice in a row should cancel the first, not queue
# a second build of a commit nobody is going to look at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # PUBLIC BY DESIGN — both of these ship inside every visitor's bundle, so
      # there is nothing to protect and no repo secret to configure. They are
      # here so the compiled output matches production instead of the
      # `YOUR_SUPABASE_URL` placeholder fallback in src/config/config.ts.
      # Keep them in step with .github/workflows/order-gate-health.yml.
      VITE_SUPABASE_URL: https://yoyiwaszogpdheuaftag.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlveWl3YXN6b2dwZGhldWFmdGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzE4NTksImV4cCI6MjA5NTkwNzg1OX0.pdCJ2k0WvhFby0iUklopzuR_3-qv99iQrn0URW7iC1A
      # Production-like build: demo mode must never be on in a shipped bundle.
      VITE_DEMO_MODE: "false"
      # Turnstile is off during the build on purpose — the gate is exercised by
      # the tests below, not by the bundle. A CI build must not depend on a
      # Cloudflare key existing.
      VITE_TURNSTILE_SITE_KEY: ""

    steps:
      - uses: actions/checkout@v4

      # Node 24, NOT 20 — and this is not cosmetic. The submit-order suite
      # imports the real function source (`supabase/functions/submit-order/index.ts`)
      # so that the file under test is the file that ships. Loading a `.ts` file
      # needs Node's built-in type stripping, which only exists from 22.6 (off by
      # default) and 22.18+/24 (on by default). On Node 20 the suite dies with
      # `ERR_UNKNOWN_FILE_EXTENSION: Unknown file extension ".ts"` before running
      # a single case — which is exactly what CI run #1 did on 2026-10-30.
      # 24 also matches the machine the suite was written and verified on.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      # 17 cases. Three of them call the live challenges.cloudflare.com/siteverify
      # endpoint with Cloudflare's own test secrets, so a red result here can
      # also mean "Cloudflare is having a bad day" rather than "this commit is
      # broken" — the suite names which case failed, so read the step log before
      # blaming the commit.
      - name: Order gate tests
        run: npm run verify:submit-order

      - name: Build
        run: npm run build

      # The gate itself. Everything above must be green before this runs, and a
      # Deploy Hook builds the LATEST commit on its branch — hence the strict
      # branch guard: firing it from a pull request would ship someone else's
      # code to production.
      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          # No hook secret. Two very different situations, and the file itself
          # says which one we are in — so this can never be silently wrong:
          #   · git deploys still on  → warning, Vercel ships it anyway
          #   · git deploys turned off → ERROR, because nothing would ship
          # `${VAR:-}` and not `${VAR}`: with `set -u` an UNSET variable aborts
          # the script, which would look like a failed deploy, not a missing
          # secret. GitHub sets it to an empty string, but a local run does not.
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            if node -e 'const v=require("./vercel.json"); process.exit(v.git?.deploymentEnabled === false ? 0 : 1)'; then
              echo "::error::vercel.json sets git.deploymentEnabled=false but VERCEL_DEPLOY_HOOK_URL is not set — this commit will NOT reach production."
              exit 1
            fi
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set. Vercel's Git integration still deploys this commit, so nothing is blocked — but CI is not gating the deploy yet (phase 1 of docs/runbooks/order-flow.md)."
            exit 0
          fi

          echo "Triggering the Vercel deploy hook…"
          curl -fsS --max-time 30 -X POST "${VERCEL_DEPLOY_HOOK_URL}" \
            -o /tmp/hook.json -w "hook accepted: HTTP %{http_code}\n"
          head -c 300 /tmp/hook.json 2>/dev/null || true
